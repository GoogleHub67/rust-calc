[package]
name = "web_calculator"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"      # Tells Cargo that lib.rs is in the root directory
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "HtmlElement",
    "Element"
]
