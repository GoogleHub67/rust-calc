[package]
name = "rust-calc"
version = "1.0.0"
edition = "2021"

[lib]
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "HtmlElement",
    "Element",
    "Node",          # Required for append_child and UI assembly
    "EventTarget"   # Required for reading button clicks natively
]
