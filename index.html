<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maths Solver - Rust Architecture</title>
    <style>
        body {
            background-color: #17181c;
            color: #e3e2e6;
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }
        .solver-container {
            background-color: #202125;
            border-radius: 28px;
            width: 720px;
            padding: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }
        h2 { font-size: 22px; font-weight: 400; margin: 0 0 16px 8px; color: #e3e2e6; }
        .display-window {
            width: 100%;
            height: 80px;
            background-color: #1e1f22;
            border: 1px solid #3c4043;
            border-radius: 16px;
            color: #ffffff;
            font-size: 28px;
            padding: 16px;
            box-sizing: border-box;
            margin-bottom: 16px;
            outline: none;
        }
        .navigation-tabs {
            display: flex;
            gap: 24px;
            border-bottom: 1px solid #3c4043;
            margin-bottom: 20px;
            padding-left: 8px;
        }
        .tab {
            padding: 12px 4px;
            cursor: pointer;
            color: #c4c7c5;
            font-size: 15px;
            font-weight: 500;
            position: relative;
        }
        .tab.active {
            color: #a8c7fa;
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 3px;
            background-color: #a8c7fa;
            border-radius: 3px 3px 0 0;
        }
        .keyboard-grid {
            display: none;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        .keyboard-grid.active { display: grid; }
        
        button {
            background-color: #303134;
            color: #e8eaed;
            border: none;
            font-size: 16px;
            padding: 16px 0;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button:hover { background-color: #3c4043; }
        
        /* Execution Button colors per tab screenshots */
        .algebra-grid .eval-btn { background-color: #b4b0ff; color: #17104d; }
        .calculus-grid .eval-btn { background-color: #ffb2be; color: #4d101c; }
        
        .templates-row {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .template-card {
            background-color: #303134;
            border: 1px solid #424548;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
        }
        .template-card:hover { background-color: #3c4043; }
    </style>
</head>
<body>

<div class="solver-container">
    <h2>Maths solver</h2>
    <input type="text" id="display" class="display-window" placeholder="0">

    <div class="navigation-tabs">
        <div class="tab active" onclick="changeTab('algebra')">Algebra</div>
        <div class="tab" onclick="changeTab('trig')">Trigonometry</div>
        <div class="tab" onclick="changeTab('calculus')">Calculus</div>
    </div>

    <!-- ALGEBRA TAB KEYBOARD -->
    <div id="algebra-board" class="keyboard-grid algebra-grid active">
        <button onclick="insert(' / ')">▢/▢</button>
        <button onclick="insert('sqrt(')">√▢</button>
        <button onclick="insert('<')">&lt;</button>
        <button onclick="insert('(')">(</button>
        <button onclick="insert(')')">)</button>
        <button onclick="dropChar()">⌫</button>
        <button onclick="resetAll()">AC</button>

        <button onclick="insert('^')">▢<sup>▢</sup></button>
        <button onclick="insert('|')">|▢|</button>
        <button onclick="insert('≤')">≤</button>
        <button class="num">7</button><button class="num">8</button><button class="num">9</button>
        <button onclick="insert('÷')">÷</button>

        <button onclick="insert('log_')">log<sub>▢</sub></button>
        <button onclick="insert('!')">▢!</button>
        <button onclick="insert('&gt;')">&gt;</button>
        <button class="num">4</button><button class="num">5</button><button class="num">6</button>
        <button onclick="insert('×')">×</button>

        <button onclick="insert('i')">i</button>
        <button onclick="insert('%')">%</button>
        <button onclick="insert('≥')">≥</button>
        <button class="num">1</button><button class="num">2</button><button class="num">3</button>
        <button onclick="insert('−')">−</button>

        <button onclick="insert('x')">x</button>
        <button onclick="insert('y')">y</button>
        <button onclick="insert('=')">=</button>
        <button class="num">0</button>
        <button onclick="insert('.')">.</button>
        <button class="eval-btn" onclick="executeRustEngine()">➔</button>
        <button onclick="insert('+')">+</button>
    </div>

    <!-- TRIGONOMETRY TAB KEYBOARD -->
    <div id="trig-board" class="keyboard-grid">
        <button onclick="insert('sin(')">sin</button>
        <button onclick="insert('cos(')">cos</button>
        <button onclick="insert('tan(')">tan</button>
        <!-- Standard math array grid replication -->
    </div>

    <!-- CALCULUS TAB KEYBOARD -->
    <div id="calculus-board" class="keyboard-grid calculus-grid">
        <button onclick="insert('d/dx ')">d/d▢</button>
        <button onclick="insert('∞')">∞</button>
        <button onclick="insert('sqrt(')">√▢</button>
        <button onclick="insert('(')">(</button>
        <button onclick="insert(')')">)</button>
        <button onclick="dropChar()">⌫</button>
        <button onclick="resetAll()">AC</button>

        <button onclick="insert('lim[▢→▢] ')">lim<sub>▢→▢</sub></button>
        <button onclick="insert('lim[▢→▢^+] ')">lim<sub>▢→▢⁺</sub></button>
        <button onclick="insert('lim[▢→▢^-] ')">lim<sub>▢→▢⁻</sub></button>
        <button class="num">7</button><button class="num">8</button><button class="num">9</button>
        <button onclick="insert('÷')">÷</button>

        <button onclick="insert('log_')">log<sub>▢</sub></button>
        <button onclick="insert('C(')">C(n,k)</button>
        <button onclick="insert('P(')">P(n,k)</button>
        <button class="num">4</button><button class="num">5</button><button class="num">6</button>
        <button onclick="insert('×')">×</button>

        <button onclick="insert('∑')">∑</button>
        <button onclick="insert('∫ ')">∫ ▢</button>
        <button onclick="insert('∫_[▢^▢] ')"><sub>▢</sub>∫<sup>▢</sup></button>
        <button class="num">1</button><button class="num">2</button><button class="num">3</button>
        <button onclick="insert('−')">−</button>

        <button onclick="insert('x')">x</button>
        <button onclick="insert('y')">y</button>
        <button onclick="insert('e')">e</button>
        <button class="num">0</button>
        <button onclick="insert('.')">.</button>
        <button class="eval-btn" onclick="executeRustEngine()">➔</button>
        <button onclick="insert('+')">+</button>
    </div>

    <!-- Visual Template Cards Bottom Layer -->
    <div class="templates-row">
        <div class="template-card" onclick="setTemplate('6x + 5 = 14')">Linear equations: <b>6x + 5 = 14</b></div>
        <div class="template-card" onclick="setTemplate('(x + 5)(x + 2)')">Polynomials: <b>(x+5)(x+2)</b></div>
        <div class="template-card" onclick="setTemplate('4x^2 - 5x - 12 = 0')">Quadratic equations: <b>4x² - 5x - 12 = 0</b></div>
    </div>
</div>

<script type="module">
    import init, { solve_math } from './pkg/web_calculator.js';

    let selectedTab = 'algebra';

    async function bootstrap() {
        await init();
        window.executeRustEngine = () => {
            const display = document.getElementById('display');
            const result = solve_math(display.value, selectedTab);
            display.value = result;
        };
    }
    bootstrap();

    window.changeTab = (tabName) => {
        selectedTab = tabName;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.keyboard-grid').forEach(b => b.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(`${tabName}-board`).classList.add('active');
    };

    window.insert = (str) => document.getElementById('display').value += str;
    window.resetAll = () => document.getElementById('display').value = '';
    window.dropChar = () => {
        let d = document.getElementById('display');
        d.value = d.value.slice(0, -1);
    };
    window.setTemplate = (expr) => {
        document.getElementById('display').value = expr.replace(/\s+/g, '');
        executeRustEngine();
    };

    document.querySelectorAll('.num').forEach(btn => {
        btn.addEventListener('click', () => insert(btn.innerText));
    });
</script>
</body>
</html>
