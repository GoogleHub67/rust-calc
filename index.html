<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maths Solver - Rust Architecture</title>
    <style>
        body {
            background-color: #17181c;
            color: #e3e2e6;
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }
        .solver-container {
            background-color: #202125;
            border-radius: 28px;
            width: 720px;
            padding: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }
        h2 { font-size: 22px; font-weight: 400; margin: 0 0 16px 8px; color: #e3e2e6; }
        .display-window {
            width: 100%;
            height: 80px;
            background-color: #1e1f22;
            border: 1px solid #3c4043;
            border-radius: 16px;
            color: #ffffff;
            font-size: 28px;
            padding: 16px;
            box-sizing: border-box;
            margin-bottom: 16px;
            outline: none;
        }
        .navigation-tabs {
            display: flex;
            gap: 24px;
            border-bottom: 1px solid #3c4043;
            margin-bottom: 20px;
            padding-left: 8px;
        }
        .tab {
            padding: 12px 4px;
            cursor: pointer;
            color: #c4c7c5;
            font-size: 15px;
            font-weight: 500;
            position: relative;
        }
        .tab.active {
            color: #a8c7fa;
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 3px;
            background-color: #a8c7fa;
            border-radius: 3px 3px 0 0;
        }
        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        button {
            background-color: #303134;
            color: #e8eaed;
            border: none;
            font-size: 16px;
            padding: 16px 0;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button:hover { background-color: #3c4043; }
        .eval-btn { background-color: #b4b0ff; color: #17104d; }
        .templates-row {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .template-card {
            background-color: #303134;
            border: 1px solid #424548;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
        }
        .template-card:hover { background-color: #3c4043; }
    </style>
</head>
<body>

<div class="solver-container">
    <h2>Maths solver</h2>
    
    <!-- Input Window field to read/write state expressions -->
    <input type="text" id="display" class="display-window" placeholder="0">

    <!-- Target insertion hook for Rust-generated navigation tabs -->
    <div id="tabs-target" class="navigation-tabs"></div>

    <!-- Target insertion hook for Rust-generated button elements matrix -->
    <div id="keyboard-target" class="keyboard-grid"></div>

    <!-- Static templates remain handled at visual bottom layer -->
    <div class="templates-row">
        <div class="template-card" id="tpl-linear">Linear equations: <b>6x + 5 = 14</b></div>
        <div class="template-card" id="tpl-poly">Polynomials: <b>(x+5)(x+2)</b></div>
        <div class="template-card" id="tpl-quad">Quadratic equations: <b>4x² - 5x - 12 = 0</b></div>
    </div>
</div>

<!-- Bootstraps your WebAssembly application engine automatically -->
<script type="module">
    import init from './pkg/web_calculator.js';
    async function run() {
        await init();
    }
    run();
</script>

</body>
</html>
